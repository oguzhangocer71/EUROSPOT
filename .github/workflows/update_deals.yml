name: Otomatik Haftalik Market Firsatlari Guncellemesi

on:
  schedule:
    # Her Pazartesi sabah saat 06:00 UTC'de otomatik calisir (Sifir Maliyet)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Manuel olarak istedigin an tetikleme butonu

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Market Tarayici Botunu Calistir
        run: |
          python market_botu.py

      - name: Guncel JSON Dosyasini Yayina Al
        run: |
          git config --global user.name "EuroSpot Automation Bot"
          git config --global user.email "bot@eurospot.local"
          git add germany_deals.json
          git commit -m "chore(catalog): Otomatik haftalik pazar firsatlari guncellendi [skip ci]" || exit 0
          git push
